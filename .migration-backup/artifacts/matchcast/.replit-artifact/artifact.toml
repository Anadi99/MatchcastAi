kind = "web"
previewPath = "/"
title = "MatchCast AI"
version = "1.0.0"
id = "artifacts/matchcast"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22888

[services.development]
run = "pnpm --filter @workspace/matchcast run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/matchcast", "run", "build" ]
publicDir = "artifacts/matchcast/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22888"
BASE_PATH = "/"
